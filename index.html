        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playTickSound() {
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(450, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.05);
            } catch(e) {}
        }

        function playWinSound() {
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(587.33, audioCtx.currentTime);
                osc.frequency.setValueAtTime(880, audioCtx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.35);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.35);
            } catch(e) {}
        }

            c1.classList.remove("winner-border");
            c2.classList.remove("winner-border");

            btn.classList.add("opacity-50", "pointer-events-none");
            c1.classList.add("spin-anim");
            c2.classList.add("spin-anim");

            let sayac = 0;
            const aralik = setInterval(() => {
                playTickSound();

                if (aktifMod === 'ulke-kulup') {
                    const rU = ulkeler[Math.floor(Math.random() * ulkeler.length)];
                    const rT = takimlar[Math.floor(Math.random() * takimlar.length)];
                    i1.innerText = rU.bayrak;
                    t1.innerText = rU.ad;
                    i2.innerText = rT.icon;
                    t2.innerText = rT.ad;
                } else if (aktifMod === 'capraz-kulup') {
                    let rT1 = takimlar[Math.floor(Math.random() * takimlar.length)];
                    let rT2 = takimlar[Math.floor(Math.random() * takimlar.length)];
                    while(rT1.ad === rT2.ad) {
                        rT2 = takimlar[Math.floor(Math.random() * takimlar.length)];
                    }
                    i1.innerText = rT1.icon;
                    t1.innerText = rT1.ad;
                    i2.innerText = rT2.icon;
                    t2.innerText = rT2.ad;
                } else if (aktifMod === 'ulke-mevki') {
                    const rU = ulkeler[Math.floor(Math.random() * ulkeler.length)];
                    const rM = mevkiler[Math.floor(Math.random() * mevkiler.length)];
                    i1.innerText = rU.bayrak;
                    t1.innerText = rU.ad;
                    i2.innerText = rM.icon;
                    t2.innerText = rM.ad;
                } else if (aktifMod === 'piyasa-degeri') {
                    let o1 = oyuncuDegerleri[Math.floor(Math.random() * oyuncuDegerleri.length)];
                    let o2 = oyuncuDegerleri[Math.floor(Math.random() * oyuncuDegerleri.length)];
                    while(o1.ad === o2.ad) {
                        o2 = oyuncuDegerleri[Math.floor(Math.random() * oyuncuDegerleri.length)];
                    }
                    p1Mevcut = o1;
                    p2Mevcut = o2;
                    i1.innerText = o1.icon;
                    t1.innerText = `${o1.ad} (${o1.kulup})`;
                    i2.innerText = o2.icon;
                    t2.innerText = `${o2.ad} (${o2.kulup})`;
                    sub1.classList.remove("hidden");
                    sub2.classList.remove("hidden");
                    sub1.innerText = "Değer: ??? M€";
                    sub2.innerText = "Değer: ??? M€";
                }

                sayac++;
                if (sayac > 14) {
                    clearInterval(aralik);
                    donuyor = false;
                    playWinSound();
                    c1.classList.remove("spin-anim");
                    c2.classList.remove("spin-anim");
                    btn.classList.remove("opacity-50", "pointer-events-none");
                }
            }, 70);
        }

        function degerleriAc() {
            if (!p1Mevcut || !p2Mevcut || aktifMod !== 'piyasa-degeri') return;
            const sub1 = document.getElementById("subBox1");
            const sub2 = document.getElementById("subBox2");
            const c1 = document.getElementById("card1");
            const c2 = document.getElementById("card2");

            sub1.innerText = `💰 ${p1Mevcut.deger} Milyon €`;
            sub2.innerText = `💰 ${p2Mevcut.deger} Milyon €`;

            playWinSound();

            if (p1Mevcut.deger > p2Mevcut.deger) {
                c1.classList.add("winner-border");
            } else if (p2Mevcut.deger > p1Mevcut.deger) {
                c2.classList.add("winner-border");
            } else {
                c1.classList.add("winner-border");
                c2.classList.add("winner-border");
            }
        }

        const scores = { 1: 0, 2: 0, 3: 0, 4: 0 };
        const sets = { 1: 0, 2: 0, 3: 0, 4: 0 };

        function skorDegis(player, delta) {
            scores[player] = Math.max(0, scores[player] + delta);
            document.getElementById(`p${player}Score`).innerText = scores[player];

            if (scores[player] >= 3) {
                sets[player]++;
                document.getElementById(`p${player}Sets`).innerText = sets[player];

                confetti({
                    particleCount: 100,
                    spread: 70,
                    origin: { y: 0.6 }
                });

                const isim = document.getElementById(`p${player}Name`).value;
                setTimeout(() => {
                    alert(`🏆 ${isim} bu seti kazandı!`);
                    turSifirla();
                }, 200);
            }
        }

        function turSifirla() {
            for (let i = 1; i <= 4; i++) {
                scores[i] = 0;
                document.getElementById(`p${i}Score`).innerText = 0;
            }
        }

        function skorSifirla() {
            turSifirla();
            for (let i = 1; i <= 4; i++) {
                sets[i] = 0;
                document.getElementById(`p${i}Sets`).innerText = 0;
            }
        }

        window.addEventListener("keydown", (e) => {
            if (e.target.tagName === 'INPUT') return;
            if (e.code === "Space") {
                e.preventDefault();
                kuraCek();
            } else if (e.key === "1") {
                skorDegis(1, 1);
            } else if (e.key === "2") {
                skorDegis(2, 1);
            } else if (e.key === "3") {
                skorDegis(3, 1);
            } else if (e.key === "4") {
                skorDegis(4, 1);
            }
        });
    </script>
</body>
</html>
