<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Futbol Bilgi Arenası | 1 Ülke 1 Kulüp</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #08080a; color: #f3f4f6; font-family: 'Inter', system-ui, sans-serif; }
        .glass-card {
            background: linear-gradient(145deg, rgba(24, 24, 32, 0.9), rgba(14, 14, 20, 0.95));
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 10px 30px -10px rgba(0,0,0,0.8);
        }
        .slot-border {
            border: 2px solid rgba(245, 158, 11, 0.4);
            box-shadow: 0 0 25px rgba(245, 158, 11, 0.15);
        }
        .neon-glow {
            text-shadow: 0 0 15px rgba(245, 158, 11, 0.6);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between p-4 md:p-8 select-none">

    <!-- ÜST BAŞLIK & MOD SEÇİMİ -->
    <header class="max-w-5xl mx-auto w-full flex flex-col sm:flex-row items-center justify-between pb-6 border-b border-white/10 gap-4">
        <div class="flex items-center gap-3">
            <span class="text-3xl">⚽</span>
            <div>
                <h1 class="text-2xl font-black tracking-wider text-amber-500 neon-glow">FUTBOL ARENASI</h1>
                <p class="text-xs text-gray-400">1 Ülke + 1 Takım = 1 Oyuncu</p>
            </div>
        </div>

        <!-- OYUN MODLARI (İleride genişletilebilir) -->
        <div class="flex items-center gap-2 bg-black/40 p-1.5 rounded-2xl border border-white/5">
            <button class="bg-amber-500 text-black px-4 py-2 rounded-xl text-xs font-black shadow-lg">1 Ülke - 1 Kulüp</button>
            <button class="text-gray-500 hover:text-gray-300 px-4 py-2 rounded-xl text-xs font-bold transition">Çapraz Kulüp (Yakında)</button>
        </div>
    </header>

    <!-- OYUN ALANI -->
    <main class="max-w-5xl mx-auto w-full grid grid-cols-1 lg:grid-cols-3 gap-8 my-auto py-6">

        <!-- KURA VE SLOT ALANI (SOL & ORTA) -->
        <div class="lg:col-span-2 flex flex-col items-center justify-center gap-8">
            <div class="grid grid-cols-2 gap-4 md:gap-6 w-full max-w-lg">
                <!-- ÜLKE KARTI -->
                <div class="glass-card slot-border rounded-3xl p-6 flex flex-col items-center justify-center text-center h-56 transition-all duration-300">
                    <span class="text-xs uppercase font-extrabold tracking-widest text-gray-500 mb-3">MİLLİYET / ÜLKE</span>
                    <div id="ulkeBayrak" class="text-6xl my-auto transition-transform duration-200">🇹🇷</div>
                    <h3 id="ulkeAdi" class="text-lg md:text-xl font-black text-white mt-2">Türkiye</h3>
                </div>

                <!-- TAKIM KARTI -->
                <div class="glass-card slot-border rounded-3xl p-6 flex flex-col items-center justify-center text-center h-56 transition-all duration-300">
                    <span class="text-xs uppercase font-extrabold tracking-widest text-gray-500 mb-3">KULÜP</span>
                    <div id="takimLogo" class="text-5xl my-auto transition-transform duration-200">🦅</div>
                    <h3 id="takimAdi" class="text-lg md:text-xl font-black text-white mt-2">Beşiktaş</h3>
                </div>
            </div>

            <!-- KURA ÇEKME BUTONU -->
            <button id="drawBtn" onclick="kuraCek()" class="w-full max-w-lg bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-400 hover:to-amber-500 text-black text-sm md:text-base font-black py-4 px-8 rounded-2xl shadow-xl shadow-amber-500/20 active:scale-95 transition-all flex items-center justify-center gap-3">
                <i class="fa-solid fa-dice text-lg"></i>
                <span>YENİ KURA ÇEK (VEYA SPACE)</span>
            </button>
        </div>

        <!-- CANLI YARIŞMA SKORU & FİKSTÜR (SAĞ PANEL) -->
        <div class="glass-card rounded-3xl p-6 flex flex-col justify-between">
            <div>
                <h3 class="text-sm font-black text-gray-300 uppercase tracking-wider mb-4 pb-2 border-b border-white/5 flex items-center justify-between">
                    <span>Masa Maçı (İlk 3 Alan)</span>
                    <button onclick="skorSifirla()" class="text-[11px] text-gray-500 hover:text-rose-400 transition">Sıfırla</button>
                </h3>

                <!-- YARIŞMACI 1 -->
                <div class="bg-black/30 p-4 rounded-2xl border border-white/5 mb-3 flex items-center justify-between">
                    <div>
                        <input type="text" id="p1Name" value="Oyuncu 1" class="bg-transparent text-sm font-bold text-white outline-none w-28 border-b border-transparent focus:border-amber-500">
                        <p class="text-[10px] text-gray-500">Klavye: [A] Tuşu</p>
                    </div>
                    <div class="flex items-center gap-2">
                        <span id="p1Score" class="text-2xl font-black text-amber-400 min-w-[28px] text-center">0</span>
                        <button onclick="skorArtir(1)" class="w-8 h-8 rounded-lg bg-amber-500/10 hover:bg-amber-500/20 text-amber-400 font-black text-sm transition">+</button>
                    </div>
                </div>

                <!-- YARIŞMACI 2 -->
                <div class="bg-black/30 p-4 rounded-2xl border border-white/5 mb-6 flex items-center justify-between">
                    <div>
                        <input type="text" id="p2Name" value="Oyuncu 2" class="bg-transparent text-sm font-bold text-white outline-none w-28 border-b border-transparent focus:border-amber-500">
                        <p class="text-[10px] text-gray-500">Klavye: [L] Tuşu</p>
                    </div>
                    <div class="flex items-center gap-2">
                        <span id="p2Score" class="text-2xl font-black text-amber-400 min-w-[28px] text-center">0</span>
                        <button onclick="skorArtir(2)" class="w-8 h-8 rounded-lg bg-amber-500/10 hover:bg-amber-500/20 text-amber-400 font-black text-sm transition">+</button>
                    </div>
                </div>

                <!-- GENEL TABLO / SET SKORU -->
                <div class="p-3 bg-amber-500/5 rounded-xl border border-amber-500/10">
                    <p class="text-[11px] font-bold text-gray-400 uppercase text-center mb-1">Set Durumu</p>
                    <div class="flex justify-around items-center text-white font-black text-lg">
                        <span id="p1Sets">0</span>
                        <span class="text-gray-600 text-xs">SET</span>
                        <span id="p2Sets">0</span>
                    </div>
                </div>
            </div>

            <div class="text-[11px] text-gray-500 text-center mt-4">
                Space: Kura Çek | A: Oyuncu 1 Puan | L: Oyuncu 2 Puan
            </div>
        </div>

    </main>

    <footer class="text-center text-xs text-gray-600 py-3">
        Toptan Muhabbetler Formatı — Futbol Bilgi Ligi v1.0
    </footer>

    <script>
        // ÜLKELER VERİTABANI
        const ulkeler = [
            { ad: "Türkiye", bayrak: "🇹🇷" }, { ad: "Brezilya", bayrak: "🇧🇷" },
            { ad: "Arjantin", bayrak: "🇦🇷" }, { ad: "Portekiz", bayrak: "🇵🇹" },
            { ad: "Fransa", bayrak: "🇫🇷" }, { ad: "Almanya", bayrak: "🇩🇪" },
            { ad: "İspanya", bayrak: "🇪🇸" }, { ad: "İtalya", bayrak: "🇮🇹" },
            { ad: "İngiltere", bayrak: "🏴󠁧󠁢󠁥󠁮󠁧󠁿" }, { ad: "Hollanda", bayrak: "🇳🇱" },
            { ad: "Belçika", bayrak: "🇧🇪" }, { ad: "Hırvatistan", bayrak: "🇭🇷" },
            { ad: "Uruguay", bayrak: "🇺🇾" }, { ad: "Kolombiya", bayrak: "🇨🇴" },
            { ad: "Nijerya", bayrak: "🇳🇬" }, { ad: "Senegal", bayrak: "🇸🇳" },
            { ad: "Fildişi Sahili", bayrak: "🇨🇮" }, { ad: "Gana", bayrak: "🇬🇭" },
            { ad: "Kamerun", bayrak: "🇨🇲" }, { ad: "Fas", bayrak: "🇲🇦" },
            { ad: "Mısır", bayrak: "🇪🇬" }, { ad: "Sırbistan", bayrak: "🇷🇸" },
            { ad: "Bosna Hersek", bayrak: "🇧🇦" }, { ad: "İsveç", bayrak: "🇸🇪" },
            { ad: "Norveç", bayrak: "🇳🇴" }, { ad: "Danimarka", bayrak: "🇩🇰" },
            { ad: "Polonya", bayrak: "🇵🇱" }, { ad: "İsviçre", bayrak: "🇨🇭" },
            { ad: "Avusturya", bayrak: "🇦🇹" }, { ad: "Yunanistan", bayrak: "🇬🇷" },
            { ad: "Japonya", bayrak: "🇯🇵" }, { ad: "Güney Kore", bayrak: "🇰🇷" },
            { ad: "Şili", bayrak: "🇨🇱" }, { ad: "Cezayir", bayrak: "🇩🇿" }
        ];

        // TAKIMLAR VERİTABANI
        const takimlar = [
            { ad: "Galatasaray", icon: "🦁" }, { ad: "Fenerbahçe", icon: "🟡" },
            { ad: "Beşiktaş", icon: "🦅" }, { ad: "Trabzonspor", icon: "🔴" },
            { ad: "Real Madrid", icon: "👑" }, { ad: "Barcelona", icon: "🔵" },
            { ad: "Atletico Madrid", icon: "⚪" }, { ad: "Manchester City", icon: "🩵" },
            { ad: "Manchester United", icon: "👹" }, { ad: "Liverpool", icon: "🔴" },
            { ad: "Arsenal", icon: "🔴" }, { ad: "Chelsea", icon: "🔵" },
            { ad: "Tottenham", icon: "⚪" }, { ad: "Bayern Münih", icon: "🔴" },
            { ad: "Borussia Dortmund", icon: "🟡" }, { ad: "Bayer Leverkusen", icon: "⚫" },
            { ad: "Juventus", icon: "⚪" }, { ad: "Inter", icon: "🔵" },
            { ad: "Milan", icon: "🔴" }, { ad: "Napoli", icon: "🩵" },
            { ad: "Roma", icon: "🐺" }, { ad: "PSG", icon: "🗼" },
            { ad: "Marsilya", icon: "⚪" }, { ad: "Lyon", icon: "🦁" },
            { ad: "Benfica", icon: "🦅" }, { ad: "Porto", icon: "🐉" },
            { ad: "Sporting CP", icon: "🦁" }, { ad: "Ajax", icon: "⚪" },
            { ad: "PSV Eindhoven", icon: "🔴" }, { ad: "Flamengo", icon: "🔴" }
        ];

        let donuyor = false;

        function kuraCek() {
            if (donuyor) return;
            donuyor = true;

            const uBayrakEl = document.getElementById("ulkeBayrak");
            const uAdEl = document.getElementById("ulkeAdi");
            const tLogoEl = document.getElementById("takimLogo");
            const tAdEl = document.getElementById("takimAdi");
            const btn = document.getElementById("drawBtn");

            btn.classList.add("opacity-50", "pointer-events-none");

            let sayac = 0;
            const aralik = setInterval(() => {
                const rU = ulkeler[Math.floor(Math.random() * ulkeler.length)];
                const rT = takimlar[Math.floor(Math.random() * takimlar.length)];

                uBayrakEl.innerText = rU.bayrak;
                uAdEl.innerText = rU.ad;
                tLogoEl.innerText = rT.icon;
                tAdEl.innerText = rT.ad;

                sayac++;
                if (sayac > 16) {
                    clearInterval(aralik);
                    donuyor = false;
                    btn.classList.remove("opacity-50", "pointer-events-none");
                }
            }, 75);
        }

        // SKOR YÖNETİMİ
        let p1 = 0, p2 = 0;
        let p1Sets = 0, p2Sets = 0;

        function skorArtir(p) {
            if (p === 1) {
                p1++;
                document.getElementById("p1Score").innerText = p1;
                if (p1 >= 3) {
                    p1Sets++;
                    document.getElementById("p1Sets").innerText = p1Sets;
                    alert(`${document.getElementById("p1Name").value} bu seti kazandı!`);
                    turSifirla();
                }
            } else {
                p2++;
                document.getElementById("p2Score").innerText = p2;
                if (p2 >= 3) {
                    p2Sets++;
                    document.getElementById("p2Sets").innerText = p2Sets;
                    alert(`${document.getElementById("p2Name").value} bu seti kazandı!`);
                    turSifirla();
                }
            }
        }

        function turSifirla() {
            p1 = 0; p2 = 0;
            document.getElementById("p1Score").innerText = 0;
            document.getElementById("p2Score").innerText = 0;
        }

        function skorSifirla() {
            turSifirla();
            p1Sets = 0; p2Sets = 0;
            document.getElementById("p1Sets").innerText = 0;
            document.getElementById("p2Sets").innerText = 0;
        }

        // KLAVYE KISAYOLLARI
        window.addEventListener("keydown", (e) => {
            if (e.target.tagName === 'INPUT') return; // İsim yazarken tuşlar tetiklenmesin
            if (e.code === "Space") {
                e.preventDefault();
                kuraCek();
            } else if (e.code === "KeyA") {
                skorArtir(1);
            } else if (e.code === "KeyL") {
                skorArtir(2);
            }
        });
    </script>
</body>
</html>
