        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playTickSound() {
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(450, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.05);
            } catch(e) {}
        }

        function playWinSound() {
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(587.33, audioCtx.currentTime);
                osc.frequency.setValueAtTime(880, audioCtx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.35);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.35);
            } catch(e) {}
        }

        function logoHatasi(boxNum) {
            const imgEl = document.getElementById(`imgBox${boxNum}`);
            const iconEl = document.getElementById(`iconBox${boxNum}`);
            imgEl.classList.add("hidden");
            iconEl.classList.remove("hidden");
            iconEl.innerText = "🛡️";
        }

        function renderBox(boxNum, data, isCustom = false) {
            const imgEl = document.getElementById(`imgBox${boxNum}`);
            const iconEl = document.getElementById(`iconBox${boxNum}`);
            const textEl = document.getElementById(`textBox${boxNum}`);

            if (isCustom) {
                imgEl.classList.add("hidden");
                iconEl.classList.remove("hidden");
                iconEl.innerText = data.icon;
            } else {
                iconEl.classList.add("hidden");
                imgEl.classList.remove("hidden");
                imgEl.src = data.logo;
            }
            textEl.innerText = data.ad;
        }

                desc.innerText = "O Ülkenin O Mevkideki Oyuncusu (Aktif / Efsane)";
                tBox1.innerText = "MİLLİYET / ÜLKE";
                tBox2.innerText = "MEVKİ";
                renderBox(1, ulkeler[1]);
                renderBox(2, mevkiler[2], true);
            } else if (mod === 'kulup-numara') {
                b4.className = "bg-amber-500 text-black px-3 py-1.5 rounded-xl text-xs font-black shadow-lg transition";
                desc.innerText = "Bu Kulüpte Bu Sırt Numarasını Terletmiş Futbolcu!";
                tBox1.innerText = "KULÜP";
                tBox2.innerText = "FORMA NUMARASI";
                renderBox(1, takimlar[0]);
                renderBox(2, { ad: "Forma No", icon: "#10" }, true);
            }
        }

        function kuraCek() {
            if (donuyor) return;
            donuyor = true;

            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }

            const c1 = document.getElementById("card1");
            const c2 = document.getElementById("card2");
            const btn = document.getElementById("drawBtn");

            btn.classList.add("opacity-50", "pointer-events-none");
            c1.classList.add("spin-anim");
            c2.classList.add("spin-anim");

            let sayac = 0;
            const aralik = setInterval(() => {
                playTickSound();

                if (aktifMod === 'ulke-kulup') {
                    const rU = ulkeler[Math.floor(Math.random() * ulkeler.length)];
                    const rT = takimlar[Math.floor(Math.random() * takimlar.length)];
                    renderBox(1, rU);
                    renderBox(2, rT);
                } else if (aktifMod === 'capraz-kulup') {
                    let rT1 = takimlar[Math.floor(Math.random() * takimlar.length)];
                    let rT2 = takimlar[Math.floor(Math.random() * takimlar.length)];
                    while(rT1.ad === rT2.ad) {
                        rT2 = takimlar[Math.floor(Math.random() * takimlar.length)];
                    }
                    renderBox(1, rT1);
                    renderBox(2, rT2);
                } else if (aktifMod === 'ulke-mevki') {
                    const rU = ulkeler[Math.floor(Math.random() * ulkeler.length)];
                    const rM = mevkiler[Math.floor(Math.random() * mevkiler.length)];
                    renderBox(1, rU);
                    renderBox(2, rM, true);
                } else if (aktifMod === 'kulup-numara') {
                    const rT = takimlar[Math.floor(Math.random() * takimlar.length)];
                    const rN = numaralar[Math.floor(Math.random() * numaralar.length)];
                    renderBox(1, rT);
                    renderBox(2, { ad: "Forma Numarası", icon: rN }, true);
                }

                sayac++;
                if (sayac > 14) {
                    clearInterval(aralik);
                    donuyor = false;
                    playWinSound();
                    c1.classList.remove("spin-anim");
                    c2.classList.remove("spin-anim");
                    btn.classList.remove("opacity-50", "pointer-events-none");
                }
            }, 70);
        }

        const scores = { 1: 0, 2: 0, 3: 0, 4: 0 };
        const sets = { 1: 0, 2: 0, 3: 0, 4: 0 };

        function skorDegis(player, delta) {
            scores[player] = Math.max(0, scores[player] + delta);
            document.getElementById(`p${player}Score`).innerText = scores[player];

            if (scores[player] >= 3) {
                sets[player]++;
                document.getElementById(`p${player}Sets`).innerText = sets[player];

                confetti({
                    particleCount: 100,
                    spread: 70,
                    origin: { y: 0.6 }
                });

                const isim = document.getElementById(`p${player}Name`).value;
                setTimeout(() => {
                    alert(`🏆 ${isim} bu seti kazandı!`);
                    turSifirla();
                }, 200);
            }
        }

        function turSifirla() {
            for (let i = 1; i <= 4; i++) {
                scores[i] = 0;
                document.getElementById(`p${i}Score`).innerText = 0;
            }
        }

        function skorSifirla() {
            turSifirla();
            for (let i = 1; i <= 4; i++) {
                sets[i] = 0;
                document.getElementById(`p${i}Sets`).innerText = 0;
            }
        }

        window.addEventListener("keydown", (e) => {
            if (e.target.tagName === 'INPUT') return;
            if (e.code === "Space") {
                e.preventDefault();
                kuraCek();
            } else if (e.key === "1") {
                skorDegis(1, 1);
            } else if (e.key === "2") {
                skorDegis(2, 1);
            } else if (e.key === "3") {
                skorDegis(3, 1);
            } else if (e.key === "4") {
                skorDegis(4, 1);
            }
        });
    </script>
</body>
</html>
